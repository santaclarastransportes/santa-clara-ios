
name: Extrair projeto Santa Clara

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extrair:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          mkdir -p /tmp/santaclara
          unzip -o SantaClara-iOS-Projeto.zip -d /tmp/santaclara
          cp -R /tmp/santaclara/SantaClara-iOS-Projeto/. .

      - name: Salvar arquivos no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Adicionar arquivos do projeto Santa Clara iOS"
            git push
          fi
