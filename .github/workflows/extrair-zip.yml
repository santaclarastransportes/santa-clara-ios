
name: Extrair ZIP do Santa Clara

"on":
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  extrair:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "ERRO: nenhum ZIP encontrado na raiz do repositorio."
            exit 1
          fi

          mkdir -p /tmp/santa-clara
          unzip -q "$ZIP" -d /tmp/santa-clara

          PACKAGE="$(find /tmp/santa-clara -name package.json -print -quit)"
          if [ -z "$PACKAGE" ]; then
            echo "ERRO: package.json nao encontrado dentro do ZIP."
            exit 1
          fi

          SOURCE_DIR="$(dirname "$PACKAGE")"
          cp -r "$SOURCE_DIR"/. .
          echo "Projeto extraido."

      - name: Salvar arquivos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao para salvar."
          else
            git commit -m "Extrair projeto iOS Santa Clara"
            git push
          fi
