
name: Extrair ZIP do Santa Clara

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extrair:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Extrair projeto iOS
        run: |
          mkdir -p /tmp/santa-clara
          unzip -q SantaClara-iOS-Projeto.zip -d /tmp/santa-clara
          SOURCE_DIR="$(dirname "$(find /tmp/santa-clara -name package.json -print -quit)")"
          if [ ! -f "$SOURCE_DIR/package.json" ]; then
            echo "Nao encontrei package.json no ZIP"
            exit 1
          fi
          cp -r "$SOURCE_DIR"/. .
          echo "Arquivos extraidos com sucesso"

      - name: Salvar arquivos no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao para salvar"
            exit 0
          fi
          git commit -m "Extrair projeto iOS Santa Clara"
          git push

